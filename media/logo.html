<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEOLUX</title>
    <style>
        body {
            background-color: #000000; /* bg */
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Fira Code', 'JetBrains Mono', 'Courier New', monospace;
            overflow: hidden;
        }

        .title {
            font-size: 10rem;
            font-weight: bold;
            letter-spacing: 0.05em;
            user-select: none;
        }

        /* Palette Colors */
        .c-light-blue { color: #66d9ef; }
        .c-blue       { color: #1E90FF; }
    </style>
</head>
<body>
    <div class="title">
        <span class="c-light-blue">N</span>
        <span class="c-light-blue">E</span>
        <span class="c-light-blue">O</span>
        <span class="c-blue">L</span>
        <span class="c-blue">U</span>
        <span class="c-blue">X</span>
    </div>
</body>
</html>
