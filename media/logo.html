<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MURIKAI</title>
    <style>
        body {
            background-color: #000000; /* bg */
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Fira Code', 'JetBrains Mono', 'Courier New', monospace;
            overflow: hidden;
        }

        .title {
            font-size: 10rem;
            font-weight: bold;
            letter-spacing: 0.05em;
            user-select: none;
        }

        /* Palette Colors */
        .c-pink       { color: #f84285; }
        .c-orange     { color: #fc971f; }
        .c-yellow     { color: #ffd700; }
        .c-green      { color: #4fe275; }
        .c-light-blue { color: #66d9ef; }
        .c-blue       { color: #1E90FF; }
        .c-purple     { color: #9c6de7; }
    </style>
</head>
<body>
    <div class="title">
        <span class="c-pink">M</span>
        <span class="c-orange">U</span>
        <span class="c-yellow">R</span>
        <span class="c-green">I</span>
        <span class="c-light-blue">K</span>
        <span class="c-blue">A</span>
        <span class="c-purple">I</span>
    </div>
</body>
</html>
